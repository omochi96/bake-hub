<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BAKE MANIA | BAKE HUB</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
:root{--bg:#FBF3E4;--surf:#FFFCF6;--ink:#2A1C16;--mut:#7A675C;--line:#E8D9C3;--acc:#C8451F;--accink:#fff;--warn:#A61E2E;--warnbg:#FBE4E4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1411;--surf:#291C17;--ink:#F6EAD3;--mut:#B79F8E;--line:#41302A;--acc:#FF8A63;--accink:#2B0F06;--warn:#FF9AA3;--warnbg:#41191E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1411;--surf:#291C17;--ink:#F6EAD3;--mut:#B79F8E;--line:#41302A;--acc:#FF8A63;--accink:#2B0F06;--warn:#FF9AA3;--warnbg:#41191E;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:14px}
.logo{font-weight:700;letter-spacing:.18em;color:var(--acc);font-size:13px;margin:0 0 2px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:0 0 8px}
button,input,select{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
button{border:1px solid var(--line);background:var(--surf);border-radius:6px;padding:8px 12px;cursor:pointer;min-height:40px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--accink);font-weight:700}
a.btn{display:inline-block;padding:9px 12px;border:1px solid var(--acc);color:var(--acc);border-radius:6px;text-decoration:none;font-weight:700}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card.low{border-left:4px solid var(--warn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.grid label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mut)}
.full{grid-column:1/-1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}
small,.mut{color:var(--mut);font-size:12px}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-weight:700}
.ok{color:var(--mut);padding:10px 0}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.res span{display:block;font-size:12px;color:var(--mut)}.res b{font-size:17px}
.neg b{color:var(--warn)}
.line{display:grid;grid-template-columns:1fr 78px 70px 34px;gap:6px;align-items:center;margin-bottom:8px}
.line .c{text-align:right;font-size:13px}.line button{padding:0;min-height:36px}
.rl{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.rl b{margin-left:auto;font-size:22px}.rl em{font-style:normal;font-size:12px;color:var(--warn)}
.t{display:grid;grid-template-columns:44px 1fr 1fr 1fr;gap:4px;padding:7px 0;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
.t>:first-child{text-align:left}.t.h{color:var(--mut);font-size:12px}.t.s{font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;min-height:54px;padding:4px 0;background:none;color:var(--mut);font-weight:700;font-size:12px}
nav button[aria-current="true"]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%}
#toast.on{opacity:1}
header.top{display:flex;align-items:center;gap:12px;background:#E25C39;color:#F6EAD3;margin:-14px -14px 14px;padding:10px 14px}
header.top img{width:52px;height:52px;border-radius:50%;flex:none}
header.top div{display:flex;flex-direction:column;align-items:flex-start;line-height:1.3}
header.top img.wm{width:auto;height:22px;border-radius:0;flex:none;margin-bottom:2px}
header.top span{font-size:12px;opacity:.9}
header.top small{color:#F6EAD3;opacity:.8}
.hero{display:flex;justify-content:center;margin-bottom:12px}
main{transform-origin:50% 30vh}
.hero img{width:116px;height:116px;border-radius:50%;background:#E25C39}
#splash{position:fixed;inset:0;background:#F6EAD3;display:flex;align-items:center;justify-content:center;z-index:20;pointer-events:none;overflow:hidden}
@keyframes sfade{0%,82%{opacity:1}100%{opacity:0}}
#sx{will-change:transform}
@keyframes sx{from{transform:translateX(-70vw)}to{transform:translateX(70vw)}}
#splash img{display:block;width:min(30vw,130px);aspect-ratio:1;border-radius:50%}
@keyframes sy{0%{transform:translateY(70px);animation-timing-function:cubic-bezier(.2,.65,.4,1)}25%{transform:translateY(-140px);animation-timing-function:cubic-bezier(.6,0,.8,.35)}50%{transform:translateY(-10px);animation-timing-function:cubic-bezier(.2,.65,.4,1)}75%{transform:translateY(-140px);animation-timing-function:cubic-bezier(.6,0,.8,.35)}100%{transform:translateY(70px)}}
@media (prefers-reduced-motion:reduce){#sx,#splash img{animation:none}}
header.top{padding:4px 14px;gap:10px;margin:-14px -14px 12px}
header.top img{width:28px;height:28px}
header.top img.wm{height:16px;margin:0}
header.top div{flex-direction:row;align-items:center;gap:10px;flex:1;min-width:0}
header.top span{display:none}
header.top small{margin-left:auto;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pic{background:#F6EAD3;border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.pic img{display:block;width:100%;height:100%;object-fit:contain}
.ph{display:flex;align-items:center;gap:12px}
.ph h1{margin:0;flex:1}
.ph>.pic{width:76px;height:76px}
.next{border:2px solid var(--acc)}
.next .nm{font-size:22px;font-weight:700;line-height:1.3;margin:2px 0}
.card.sm{padding:10px 12px}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:inherit;color:inherit;min-height:110px;resize:vertical;margin-top:4px}
button.evb{display:block;width:100%;text-align:left;font:inherit;color:inherit}
.badge{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mut)}
.badge.w{color:var(--warn);border-color:var(--warn)}.badge.ok2{color:var(--acc);border-color:var(--acc)}
</style>
</head>

<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>

var ref=null,dirty=false,writing=false,syncMsg="この端末のみ保存",tmr=null,lt=null,synced=false;
function setSync(m){syncMsg=m;var e=$("#sync");if(e)e.textContent=m}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}dirty=true;if(ref){setSync("保存中…");clearTimeout(tmr);tmr=setTimeout(push,700)}}
function push(){if(!ref)return;if(writing){tmr=setTimeout(push,400);return}writing=true;var snap=JSON.stringify(S),o=JSON.parse(snap);o._t=Date.now();
ref.set(o).then(function(){writing=false;if(JSON.stringify(S)===snap){dirty=false;setSync("同期済み")}else push()}).catch(function(){writing=false;setSync("同期に失敗(この端末には保存済み)")})}
function adopt(d){if(dirty)return;var o=JSON.parse(JSON.stringify(d));delete o._t;if(!o.mats)return;
if(document.activeElement&&/INPUT|SELECT/.test(document.activeElement.tagName)){setTimeout(function(){adopt(d)},1500);return}
var chg=ens(o);S=o;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render();if(chg)save()}
function onSnap(s){var md=s.metadata||{};if(md.hasPendingWrites)return;
if(!md.fromCache){clearTimeout(lt);synced=true}
if(!s.exists){if(md.fromCache)return;push();return}
var d=s.data(),o=JSON.parse(JSON.stringify(d));delete o._t;
if(JSON.stringify(o)===JSON.stringify(S)){if(!dirty&&synced)setSync("同期済み");return}
if(dirty)return;adopt(d);if(synced)setSync("同期済み")}

function evCalc(e){var sales=e.cash+e.card+e.emoney+e.qr,c=S.cfg;
var fees=e.cash*c.cash/100+e.card*c.card/100+e.emoney*c.emoney/100+e.qr*c.qr/100;
var cogs=e.items.reduce(function(a,i){return a+i.out*i.cost},0),loss=e.items.reduce(function(a,i){return a+i.loss},0),gross=sales-cogs;
return{sales:sales,fees:fees,cogs:cogs,loss:loss,gross:gross,exp:e.fee+(e.trans||0),net:gross-fees-e.fee-(e.trans||0),per:e.visitors?sales/e.visitors:0}}
